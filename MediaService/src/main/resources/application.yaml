server:
  port: ${MEDIA_SERVER_PORT:8086}

spring:
  application:
    name: media-service
  datasource:
    url: ${MEDIA_DB_URL}
    username: ${MEDIA_DB_USERNAME:postgres}
    password: ${MEDIA_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true

springdoc:
  api-docs:
    enabled: ${MEDIA_SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${MEDIA_SWAGGER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

media:
  jwt:
    issuer: ${MEDIA_JWT_ISSUER}
    jwks-uri: ${MEDIA_JWT_JWKS_URI}
  r2:
    endpoint: ${MEDIA_R2_ENDPOINT}
    bucket: ${MEDIA_R2_BUCKET}
    access-key-id: ${MEDIA_R2_ACCESS_KEY_ID}
    secret-access-key: ${MEDIA_R2_SECRET_ACCESS_KEY}
    download-url-ttl-seconds: ${MEDIA_R2_DOWNLOAD_URL_TTL_SECONDS:300}
