services:
  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: ${IDENTITY_DB_NAME:-CARECONNECT_IDENTITY}
      POSTGRES_USER: ${IDENTITY_DB_USERNAME:?Set IDENTITY_DB_USERNAME}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD}

    ports:
      - "127.0.0.1:${IDENTITY_DB_PORT:-5441}:5432"

    volumes:
      - identity_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    ports:
      - "127.0.0.1:${IDENTITY_REDIS_PORT:-6381}:6379"
    volumes:
      - identity_redis:/data

volumes:
  identity_postgres:
  identity_redis:
