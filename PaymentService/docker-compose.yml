services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME:-CARECONNECT_PAYMENT}
      POSTGRES_USER: ${PAYMENT_DB_USERNAME:?Set PAYMENT_DB_USERNAME}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD}
    ports:
      - "127.0.0.1:${PAYMENT_DB_PORT:-5447}:5432"
    volumes:
      - payment_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  payment_postgres:
