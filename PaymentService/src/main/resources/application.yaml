server:
  port: ${PAYMENT_SERVER_PORT:8087}

spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  sql:
    init:
      mode: never
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true

management:
  endpoints.web.exposure.include: health,info

payment:
  jwt:
    issuer: ${PAYMENT_JWT_ISSUER:careconnect-identity}
    jwks-uri: ${PAYMENT_JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  booking-url: ${PAYMENT_BOOKING_URL:http://localhost:8080}
  identity-url: ${PAYMENT_IDENTITY_URL:http://localhost:8080}
  service-client:
    client-id: ${PAYMENT_SERVICE_CLIENT_ID:}
    client-secret: ${PAYMENT_SERVICE_CLIENT_SECRET:}
  policy:
    # D17: chỉ để cảnh báo khi lệch — % cọc thật lấy từ dòng GLOBAL của platform_policies (seed 30).
    deposit-percent: ${PAYMENT_DEPOSIT_PERCENT:30}
  vnpay:
    enabled: ${VNPAY_ENABLED:false}
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    # Trang FE kiểm chữ ký qua GET /api/v1/payments/vnpay/return rồi poll trạng thái (Đợt 1c).
    return-url: ${VNPAY_RETURN_URL:http://localhost:5173/customer/payments/vnpay-return}
    api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
    server-ip: ${VNPAY_SERVER_IP:127.0.0.1}
    connect-timeout: ${VNPAY_CONNECT_TIMEOUT:5s}
    read-timeout: ${VNPAY_READ_TIMEOUT:15s}
    querydr-enabled: ${VNPAY_QUERYDR_ENABLED:false}
  stripe:
    enabled: ${STRIPE_ENABLED:false}
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:8087/api/v1/payments/stripe/return?session_id={CHECKOUT_SESSION_ID}}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/payment/cancel}
  refund:
    mode: ${PAYMENT_REFUND_MODE:SIMULATED}
    scan-interval: ${PAYMENT_REFUND_SCAN_INTERVAL:30s}
    batch-size: ${PAYMENT_REFUND_BATCH_SIZE:20}
    max-attempts: ${PAYMENT_REFUND_MAX_ATTEMPTS:5}
    backoff-base: ${PAYMENT_REFUND_BACKOFF_BASE:1m}
    backoff-max: ${PAYMENT_REFUND_BACKOFF_MAX:1h}
    claim-lease: ${PAYMENT_REFUND_CLAIM_LEASE:2m}
  invoice:
    overdue-scan-interval: ${PAYMENT_INVOICE_OVERDUE_SCAN_INTERVAL:10m}
    batch-size: ${PAYMENT_INVOICE_BATCH_SIZE:50}
  outbox:
    scan-interval: ${PAYMENT_OUTBOX_SCAN_INTERVAL:30s}
    max-attempts: ${PAYMENT_OUTBOX_MAX_ATTEMPTS:10}
    backoff-base: ${PAYMENT_OUTBOX_BACKOFF_BASE:30s}
    backoff-max: ${PAYMENT_OUTBOX_BACKOFF_MAX:30m}
  expiry:
    scan-interval: ${PAYMENT_EXPIRY_SCAN_INTERVAL:5m}
    grace: ${PAYMENT_EXPIRY_GRACE:5m}
    max-unknown: ${PAYMENT_EXPIRY_MAX_UNKNOWN:24h}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
