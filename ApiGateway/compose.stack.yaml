# Mảnh Compose của ApiGateway cho stack tổng — chỉ dùng qua ../compose.yaml (project "careconnect").
# ${...} lấy từ ApiGateway/.env; environment chỉ ghi đè URL service phía sau sang tên service trên mạng Docker.
# docker-compose.yml riêng của gateway (JAR + host.docker.internal) giữ nguyên; không chạy song song (cùng port).
services:
  api-gateway:
    build: .
    image: careconnect/api-gateway:dev
    env_file: .env
    environment:
      GATEWAY_SERVER_PORT: "8080"
      GATEWAY_IDENTITY_URL: http://identity-service:8081
      GATEWAY_CARE_RECIPIENT_URL: http://care-recipient-service:8082
      GATEWAY_BOOKING_URL: http://booking-service:8085
      GATEWAY_PROVIDER_URL: http://provider-service:8084
      GATEWAY_CARE_CATALOG_URL: http://care-catalog-service:8083
      GATEWAY_MEDIA_URL: http://media-service:8086
      GATEWAY_JWT_JWKS_URI: http://identity-service:8081/.well-known/jwks.json
    ports:
      - "127.0.0.1:${GATEWAY_SERVER_PORT:-8080}:8080"
    # Gateway chỉ gọi service phía sau / JWKS khi có request — không cần chờ chúng lúc khởi động.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
      start_interval: 5s
