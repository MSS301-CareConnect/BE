spring:
  application:
    name: ProviderService

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${PROVIDER_DB_URL}
    username: ${PROVIDER_DB_USERNAME}
    password: ${PROVIDER_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  sql:
    init:
      mode: never

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          media:
            connect-timeout: ${PROVIDER_MEDIA_CONNECT_TIMEOUT_MS:2000}
            read-timeout: ${PROVIDER_MEDIA_READ_TIMEOUT_MS:10000}
            logger-level: none
          identity:
            connect-timeout: ${PROVIDER_IDENTITY_CONNECT_TIMEOUT_MS:2000}
            read-timeout: ${PROVIDER_IDENTITY_READ_TIMEOUT_MS:3000}
            logger-level: none
          care-catalog:
            connect-timeout: ${PROVIDER_CARE_CATALOG_CONNECT_TIMEOUT_MS:2000}
            read-timeout: ${PROVIDER_CARE_CATALOG_READ_TIMEOUT_MS:3000}
            logger-level: none
          booking:
            connect-timeout: ${PROVIDER_BOOKING_CONNECT_TIMEOUT_MS:2000}
            read-timeout: ${PROVIDER_BOOKING_READ_TIMEOUT_MS:3000}
            logger-level: none
    circuitbreaker:
      resilience4j:
        disable-thread-pool: true
        disable-time-limiter: true
      bulkhead:
        resilience4j:
          enabled: false

server:
  port: ${PROVIDER_SERVER_PORT:8084}

springdoc:
  api-docs:
    enabled: ${PROVIDER_SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${PROVIDER_SWAGGER_ENABLED:true}
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

provider:
  outbox:
    max-attempts: ${PROVIDER_OUTBOX_MAX_ATTEMPTS:10}
    lease: ${PROVIDER_OUTBOX_LEASE:60s}
    max-backoff: ${PROVIDER_OUTBOX_MAX_BACKOFF:1h}
  open-api-server-url: ${PROVIDER_OPENAPI_SERVER_URL:}

  jwt:
    issuer: ${PROVIDER_JWT_ISSUER}
    jwks-uri: ${PROVIDER_JWT_JWKS_URI}

  identity:
    url: ${PROVIDER_IDENTITY_URL}

  media:
    url: ${PROVIDER_MEDIA_URL:http://localhost:8080}

  # CareCatalogService qua ApiGateway (không cắt prefix) — kiểm offering khi gán kỹ năng caregiver.
  care-catalog:
    url: ${PROVIDER_CARE_CATALOG_URL:http://localhost:8080}

  # BookingService qua ApiGateway — caregiver bận (C5.1) khi tạo ngày nghỉ / hủy lịch / tìm caregiver theo khung giờ.
  booking:
    url: ${PROVIDER_BOOKING_URL:http://localhost:8080}

  # Client-credentials xin token SERVICE ở Identity (POST /api/v1/auth/service-token, qua provider.identity.url).
  service-client:
    client-id: ${PROVIDER_SERVICE_CLIENT_ID:}
    client-secret: ${PROVIDER_SERVICE_CLIENT_SECRET:}
    connect-timeout: ${PROVIDER_SERVICE_TOKEN_CONNECT_TIMEOUT:2s}
    read-timeout: ${PROVIDER_SERVICE_TOKEN_READ_TIMEOUT:3s}
