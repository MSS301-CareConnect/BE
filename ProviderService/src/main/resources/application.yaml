spring:
  application:
    name: ProviderService

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${PROVIDER_DB_URL}
    username: ${PROVIDER_DB_USERNAME}
    password: ${PROVIDER_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  sql:
    init:
      mode: never

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          identity:
            connect-timeout: ${PROVIDER_IDENTITY_CONNECT_TIMEOUT_MS:2000}
            read-timeout: ${PROVIDER_IDENTITY_READ_TIMEOUT_MS:3000}
            logger-level: none
    circuitbreaker:
      resilience4j:
        disable-thread-pool: true
        disable-time-limiter: true
      bulkhead:
        resilience4j:
          enabled: false

server:
  port: ${PROVIDER_SERVER_PORT:8084}

springdoc:
  api-docs:
    enabled: ${PROVIDER_SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${PROVIDER_SWAGGER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

provider:
  internal-secret: ${PROVIDER_INTERNAL_SECRET:}
  open-api-server-url: ${PROVIDER_OPENAPI_SERVER_URL:}

  jwt:
    issuer: ${PROVIDER_JWT_ISSUER}
    jwks-uri: ${PROVIDER_JWT_JWKS_URI}

  identity:
    url: ${PROVIDER_IDENTITY_URL}
    internal-secret: ${PROVIDER_IDENTITY_INTERNAL_SECRET:}
